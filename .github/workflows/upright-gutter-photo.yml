name: Upright gutter photo

on:
  push:
    branches: [main]
    paths: [.github/workflows/upright-gutter-photo.yml]

permissions:
  contents: write

jobs:
  rotate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install Pillow
      - name: Correct gutter orientation
        run: |
          python - <<'PY'
          from PIL import Image
          stem='images/gutter-guard-micro-mesh-installed'
          im=Image.open(stem+'.jpg').convert('RGB').rotate(-90,expand=True)
          im.save(stem+'.jpg',quality=86,optimize=True,progressive=True)
          im.save(stem+'.webp','WEBP',quality=82,method=6)
          PY
      - name: Commit upright photo
        run: |
          git config user.name "CleanGutters site updater"
          git config user.email "actions@users.noreply.github.com"
          git add images/gutter-guard-micro-mesh-installed.*
          git commit -m "Set gutter photo upright"
          git push
