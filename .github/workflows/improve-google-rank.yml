name: Improve South Jersey landing page
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update-page:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply approved landing page improvements
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          replacements = {
            '<title>Gutter Guard Installation Near You | NJ, PA & DE | CleanGutters</title>': '<title>South Jersey Gutter Guard Installation | CleanGutters Lighting</title>',
            '<meta name="description" content="Owner-installed stainless-steel micro-mesh gutter guards serving NJ, Eastern PA and Delaware from Cherry Hill. Get a free, no-pressure estimate.">': '<meta name="description" content="Owner-installed stainless-steel micro-mesh gutter guards for South Jersey homes. Alex installs every job personally. Free, no-pressure estimate.">',
            '<link rel="preload" as="image" href="/images/hero.webp" fetchpriority="high">': '<link rel="preload" as="image" href="/images/realwork-4.webp" fetchpriority="high">',
            '<source srcset="/images/hero.webp" type="image/webp">\n        <img src="/images/hero-opt.jpg" alt="CleanGutters completed gutter guard installation on a New Jersey home" width="1200" height="900" fetchpriority="high">': '<source srcset="/images/realwork-4.webp" type="image/webp">\n        <img src="/images/realwork-4-opt.jpg" alt="Real CleanGutters Lighting gutter guard installation on a South Jersey home" width="600" height="450" fetchpriority="high">',
            '<div class="hero-badge">Owner-Installed · No Subcontractors · Fully Insured · Lifetime Transferable Warranty</div>': '<div class="hero-badge">South Jersey · Owner-Installed · No Subcontractors · Lifetime Transferable Warranty</div>',
            '<h1>Professional Gutter Guard Installation Near You in NJ, PA &amp; Delaware</h1>': '<h1>South Jersey Gutter Guard Installation — Done Personally by the Owner</h1>',
            '<p class="hero-sub">Protect your home from leaves, pine needles and roof debris with professionally installed stainless-steel micro-mesh gutter guards. CleanGutters is based in Cherry Hill and serves homeowners within approximately 100 miles across New Jersey, Eastern Pennsylvania and Delaware.</p>': '<p class="hero-sub">Alex installs surgical stainless-steel micro-mesh gutter guards across South Jersey—never subcontractors. Protect your home from leaves, pine needles and roof debris with a lifetime transferable warranty and a clear, no-pressure estimate.</p>',
            '<p class="form-sub">⏱ Alex usually responds within 2 business hours</p>': '<p class="form-sub">Real South Jersey work · Alex usually responds within 2 business hours</p>'
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'Missing expected text: {old[:80]}')
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name "Ryze"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Improve South Jersey landing page relevance"
          git push
