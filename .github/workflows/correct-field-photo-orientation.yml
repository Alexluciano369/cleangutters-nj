name: Correct field photo orientation

on:
  push:
    branches: [main]
    paths: [.github/workflows/correct-field-photo-orientation.yml]

permissions:
  contents: write

jobs:
  correct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install Pillow
      - name: Rotate photos upright
        run: |
          python - <<'PY'
          from PIL import Image
          for stem in ['images/gutter-guard-micro-mesh-installed','images/alex-owner-installing-gutter-guards']:
              im=Image.open(stem+'.jpg').convert('RGB').rotate(180,expand=True)
              im.save(stem+'.jpg',quality=86,optimize=True,progressive=True)
              im.save(stem+'.webp','WEBP',quality=82,method=6)
          PY
      - name: Commit corrected photos
        run: |
          git config user.name "CleanGutters site updater"
          git config user.email "actions@users.noreply.github.com"
          git add images/gutter-guard-micro-mesh-installed.* images/alex-owner-installing-gutter-guards.*
          git commit -m "Correct field photo orientation"
          git push
