name: Add senior savings banner

on:
  push:
    branches: [main]
    paths: [.github/workflows/add-senior-savings-banner.yml]

permissions:
  contents: write

jobs:
  add:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add the offer to every service landing page
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          banner='<div style="background:#fef3c7;color:#78350f;text-align:center;padding:13px 16px;font-weight:900;font-size:1rem;border-bottom:2px solid #f59e0b">SENIORS SAVE 10% — or take $250 off, whichever saves more. New installations only · Book by Oct. 31 · Cannot combine.</div>'
          for name in ['gutter-cleaning/index.html','gutter-repair/index.html','gutter-installation/index.html']:
            p=Path(name); s=p.read_text()
            if 'SENIORS SAVE 10%' not in s:
              s=re.sub(r'(<div class="bar">.*?</div>)',r'\1'+banner,s,count=1)
            p.write_text(s)
          PY
      - name: Save senior offer banner
        run: |
          git config user.name "CleanGutters ad landing pages"
          git config user.email "actions@users.noreply.github.com"
          git add gutter-cleaning/index.html gutter-repair/index.html gutter-installation/index.html
          git commit -m "Show senior installation savings on NJ service pages"
          git push
