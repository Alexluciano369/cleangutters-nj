name: Fix live photo orientation

on:
  push:
    branches: [main]
    paths: [.github/workflows/fix-live-photo-orientation.yml]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install Pillow
      - name: Rotate both live website photos 180 degrees
        run: |
          python - <<'PY'
          from PIL import Image
          for stem in ['images/alex-owner-installing-gutter-guards','images/gutter-guard-micro-mesh-installed']:
              im = Image.open(stem + '.jpg').convert('RGB').rotate(180, expand=True)
              im.save(stem + '.jpg', quality=86, optimize=True, progressive=True)
              im.save(stem + '.webp', 'WEBP', quality=82, method=6)
          PY
      - name: Commit corrected photos
        run: |
          git config user.name "CleanGutters site updater"
          git config user.email "actions@users.noreply.github.com"
          git add images/alex-owner-installing-gutter-guards.* images/gutter-guard-micro-mesh-installed.*
          git commit -m "Rotate NJ website photos upright"
          git push
