name: Restore correct field photos

on:
  push:
    branches: [main]
    paths: [.github/workflows/restore-correct-field-photos.yml]

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install Pillow
      - name: Save camera-correct photos
        run: |
          curl -L "https://tpc.googlesyndication.com/simgad/7642855119294241672" -o /tmp/gutter.jpg
          curl -L "https://tpc.googlesyndication.com/simgad/14874282419723731841" -o /tmp/alex.jpg
          python - <<'PY'
          from PIL import Image
          for src,stem in [('/tmp/gutter.jpg','images/gutter-guard-micro-mesh-installed'),('/tmp/alex.jpg','images/alex-owner-installing-gutter-guards')]:
              im=Image.open(src).convert('RGB'); im.thumbnail((1600,1600),Image.Resampling.LANCZOS)
              im.save(stem+'.jpg',quality=86,optimize=True,progressive=True); im.save(stem+'.webp','WEBP',quality=82,method=6)
          PY
      - name: Commit photos
        run: |
          git config user.name "CleanGutters site updater"
          git config user.email "actions@users.noreply.github.com"
          git add images/gutter-guard-micro-mesh-installed.* images/alex-owner-installing-gutter-guards.*
          git commit -m "Restore camera-correct field photos"
          git push
