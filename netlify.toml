[build]
  command = ""
  publish = "."

[[redirects]]
  from = "/cleaning"
  to = "https://cleangutterslighting.com/gutter-cleaning"
  status = 301
  force = true

[[redirects]]
  from = "/cleaning.html"
  to = "https://cleangutterslighting.com/gutter-cleaning"
  status = 301
  force = true

[[redirects]]
  from = "/repair"
  to = "https://cleangutterslighting.com/gutter-repair"
  status = 301
  force = true

[[redirects]]
  from = "/repair.html"
  to = "https://cleangutterslighting.com/gutter-repair"
  status = 301
  force = true

[[redirects]]
  from = "/gutter-guard-installation-cherry-hill-nj"
  to = "https://cleangutterslighting.com/locations/cherry-hill-nj/gutter-guards/"
  status = 301
  force = true

[[redirects]]
  from = "/gutter-guard-installation-cherry-hill-nj/"
  to = "https://cleangutterslighting.com/locations/cherry-hill-nj/gutter-guards/"
  status = 301
  force = true

[[headers]]
  for = "/"
  [headers.values]
    Content-Type = "text/html; charset=utf-8"
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.html"
  [headers.values]
    Content-Type = "text/html; charset=utf-8"
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/images/*.webp"
  [headers.values]
    Content-Type = "image/webp"
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*.jpg"
  [headers.values]
    Content-Type = "image/jpeg"
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*.png"
  [headers.values]
    Content-Type = "image/png"
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Content-Type = "text/css; charset=utf-8"
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Content-Type = "application/javascript; charset=utf-8"
    Cache-Control = "public, max-age=31536000, immutable"
